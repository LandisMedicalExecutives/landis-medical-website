<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="200" fill="#ffffff"/>
  
  <!-- Traditional/Old Style Medical Cross symbol -->
  <g transform="translate(60, 60)">
    <!-- Circle background for cross -->
    <circle cx="50" cy="50" r="45" fill="#0066cc" opacity="0.1" stroke="#0066cc" stroke-width="2"/>
    
    <!-- Old style cross with extended arms -->
    <rect x="42" y="10" width="16" height="80" fill="#0066cc" rx="2"/>
    <rect x="10" y="42" width="80" height="16" fill="#0066cc" rx="2"/>
    
    <!-- Extended arms at the ends (cross pattée style) -->
    <rect x="38" y="5" width="24" height="10" fill="#0066cc" rx="1"/>
    <rect x="38" y="85" width="24" height="10" fill="#0066cc" rx="1"/>
    <rect x="5" y="38" width="10" height="24" fill="#0066cc" rx="1"/>
    <rect x="85" y="38" width="10" height="24" fill="#0066cc" rx="1"/>
  </g>
  
  <!-- Text -->
  <text x="140" y="85" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0066cc">
    Landis Medical
  </text>
  <text x="140" y="115" font-family="Arial, sans-serif" font-size="24" fill="#333333">
    Associates
  </text>
  
  <!-- Decorative line -->
  <line x1="140" y1="125" x2="400" y2="125" stroke="#0066cc" stroke-width="2" opacity="0.3"/>
</svg>