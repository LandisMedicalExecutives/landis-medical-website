<svg viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="200" fill="#ffffff"/>
  
  <!-- Caduceus Medical Symbol (staff with two snakes) -->
  <g transform="translate(50, 50)">
    <!-- Staff -->
    <rect x="45" y="10" width="10" height="90" fill="#1e3a8a" rx="2"/>
    
    <!-- Left snake curve -->
    <path d="M 40 25 Q 30 35, 35 45 Q 40 55, 30 65" stroke="#dc2626" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Left snake head -->
    <circle cx="28" cy="68" r="4" fill="#dc2626"/>
    
    <!-- Right snake curve -->
    <path d="M 60 25 Q 70 35, 65 45 Q 60 55, 70 65" stroke="#dc2626" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Right snake head -->
    <circle cx="72" cy="68" r="4" fill="#dc2626"/>
    
    <!-- Wings -->
    <path d="M 50 40 L 35 35 L 40 40 Z" fill="#1e3a8a"/>
    <path d="M 50 40 L 65 35 L 60 40 Z" fill="#1e3a8a"/>
  </g>
  
  <!-- Text -->
  <text x="160" y="90" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#1e3a8a">
    Landis Medical
  </text>
  <text x="160" y="125" font-family="Georgia, serif" font-size="28" fill="#dc2626">
    Associates
  </text>
</svg>